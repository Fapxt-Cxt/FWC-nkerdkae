<!DOCTYPE html>
<head>
    <title>Calculator</title>
    <link rel="stylesheet" href="calc.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <form id="calc-form">
        <input type="text" id="left-val" placeholder="Left operand">

        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
        </select>

        <input type="text" id="right-val" placeholder="Right operand">

        <input type="submit" value="Try me!">
    </form>

    <script src="calc.js"></script>
</body>
